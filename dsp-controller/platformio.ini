; Controlador DSP ADAU1701 com ATmega328PB
; Encoder rotativo + LCD 16x2 + LEDs indicadores
; Crossover / EQ paramétrico / Delay / Ganho / Mute
;
; O ATmega328PB é pino-a-pino compatível com o núcleo do ATmega328P usado
; no Arduino Uno, então o core MiniCore (que suporta oficialmente o 328PB,
; incluindo a UART/I2C/SPI extras) é usado para gravação de fuses corretos
; e para termos certeza de que o clock/bootloader batem com o hardware.
;
; Documentação MiniCore: https://github.com/MCUdude/MiniCore

[platformio]
default_envs = ATmega328PB

[env:ATmega328PB]
platform = atmelavr
board = ATmega328PB
framework = arduino

; --- Clock do projeto -------------------------------------------------
; Ajuste conforme o cristal/ressonador realmente soldado na placa.
board_build.f_cpu = 16000000L

; --- Programação ---------------------------------------------------------
; Por padrão grava via um programador ISP externo (USBasp/USBtinyISP/etc).
; Troque upload_protocol conforme o programador disponível.
upload_protocol = usbasp
upload_flags =
    -PUSB

; Fuses recomendados para 328PB + cristal externo 16MHz, BOD 2.7V,
; sem prescaler de clock, EEPROM preservada em regravações.
board_hardware.oscillator = external
board_hardware.uart = uart0
board_hardware.bod = 2v7
board_hardware.eesave = yes

lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

build_flags =
    -Wall
    -Wextra
